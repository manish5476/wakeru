<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Email Has Been Changed</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      color: #333;
      font-size: 24px;
      margin: 0;
    }
    .content {
      font-size: 16px;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Wareku</h1>
    </div>
    <div class="content">
      <p>Hello {{displayName}},</p>
      <p>This is a confirmation that the email address for your Wareku account has been changed.</p>
      <p>If you did not make this change, please contact our support team immediately to secure your account.</p>
    </div>
    <div class="footer">
        <p>Wareku Support | <a href="mailto:support@wareku.net">support@wareku.net</a></p>
        <p>&copy; {{year}} Wareku</p>
    </div>
  </div>
</body>
</html>
